<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Intro component with sign up form</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="p-0 m-0">
  <main>
    <div class="row container-fluid d-flex justify-content-center align-items-center min-vh-100 p-3">
      <div class="col-lg-6 col-md-6 col-sm-12">
        <div class="text text-center text-md-start py-3 py-3">
          <h1 class="text-white">Learn to code by watching others</h1>
          <p class="text-white ">
            See how experienced developers solve problems in real-time. Watching scripted tutorials is great,
            but understanding how developers think is invaluable.
          </p>
        </div>
      </div>
      <div class="col-lg-6 col-md-6 col-sm-12">
        <h2 class="free p-3 text-center rounded my-3">Try it free 7 days then $20/mo. thereafter</h2>
        <div class="form p-3 bg-white rounded">
          <form class="d-flex flex-column gap-3" action="f">

            <div>
              <input maxlength="20" minlength="7" type="text" id="" placeholder="First Name " required
                class="border border-1 border-secondary p-2 rounded form-control mw-100">
            </div>

            <input maxlength="20" minlength="7" type="text" id="" placeholder="Last Name" required
              class="border border-1 border-secondary p-2 rounded form-control ">

            <input type="email" id="" placeholder="Email Address" required
              class="border border-1 border-secondary p-2 rounded form-control">

            <input maxlength="16" minlength="7" type="password" id="" placeholder="Password" required
              class="border border-1 border-secondary p-2 rounded form-control">

            <button class="claim border border-0 text-white bg-sucess p-2 rounded text-uppercase">Claim your free
              trial</button>

          </form>
          <p class="text-center text-black-50 my-3 clicking">
            By clicking the button, you are agreeing to our
            <span class="fw-bold">
              Terms and Services
            </span>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>
  <script>
    document.querySelectorAll('input').forEach((input) => {
      input.addEventListener('input', () => {
        if (input.checkValidity()) {
          input.classList.add('is-valid')
          input.classList.remove('is-invalid');
        } else {
          input.classList.add('is-invalid');
        }
      })
    })

  </script>
</body>

</html>
